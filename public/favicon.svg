<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Master Apple Gradient -->
    <linearGradient id="appleBg" x1="12%" y1="92%" x2="88%" y2="8%">
      <stop offset="0%" stop-color="#0051d5" />
      <stop offset="45%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#6e3aff" />
    </linearGradient>

    <radialGradient id="topGlow" cx="82%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#9355ff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#6e3aff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottomGlow" cx="25%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#0080ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0051d5" stop-opacity="0" />
    </radialGradient>

    <!-- Translucent Glass Gradients for V Glyph -->
    <linearGradient id="leftPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#e8f0fe" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#c2d7fe" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="leftBackLeaf" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#99baff" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="ribbonRight" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#e0e8ff" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#b0c8ff" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="ribbonLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7c9dfa" stop-opacity="0.45" />
    </linearGradient>

    <!-- Soft Ambient Drop Shadow for V Glyph -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#001859" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001859" flood-opacity="0.2" />
    </filter>

    <!-- Apple Squircle Clip Path -->
    <clipPath id="squircleClip">
      <path d="M 0,256 C 0,60 60,0 256,0 C 452,0 512,60 512,256 C 512,452 452,512 256,512 C 60,512 0,452 0,256 Z" />
    </clipPath>
  </defs>

  <!-- Background with Apple Continuous Superellipse Mask -->
  <g clip-path="url(#squircleClip)">
    <rect width="512" height="512" fill="url(#appleBg)" />
    <rect width="512" height="512" fill="url(#topGlow)" />
    <rect width="512" height="512" fill="url(#bottomGlow)" />

    <!-- Apple Hairline Inner Specular Rim -->
    <path d="M 0,256 C 0,60 60,0 256,0 C 452,0 512,60 512,256 C 512,452 452,512 256,512 C 60,512 0,452 0,256 Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.5" />

    <!-- The Sculptural V Ribbon Glyph with Glass & Book Metaphor -->
    <g filter="url(#glyphShadow)">
      <!-- Back Page / Leaf of Open Book -->
      <path d="M 125,145 C 105,175 110,240 185,340 L 225,385 C 205,345 155,245 145,160 C 140,135 130,135 125,145 Z"
            fill="url(#leftBackLeaf)" />

      <!-- Left Turning Page / Stem of V -->
      <path d="M 145,130 C 145,130 185,145 222,210 C 255,268 252,350 256,388 C 248,348 215,260 178,198 C 158,165 145,140 145,130 Z"
            fill="url(#leftPage)" />
      
      <!-- Primary Left Book Wing Shape -->
      <path d="M 146,132 C 180,140 214,192 238,268 C 252,312 256,368 256,388 C 252,388 238,370 216,334 C 182,278 152,204 146,132 Z"
            fill="url(#leftPage)" />
      
      <!-- Soft translucent apex sweep connecting pages to ribbon -->
      <path d="M 238,362 C 248,382 264,382 274,362 C 290,326 332,228 368,148 C 386,110 412,110 422,132 C 430,148 426,172 408,212 L 358,326 C 338,368 308,392 256,392 C 204,392 174,368 154,326 L 146,132 C 196,152 230,242 256,328 C 262,310 270,288 280,262 C 265,302 248,345 238,362 Z"
            fill="#ffffff" fill-opacity="0.1" />

      <!-- Right Bookmark Ribbon Body -->
      <path d="M 256,388 C 262,384 278,352 300,300 C 330,230 376,140 405,130 C 424,124 438,138 434,162 C 430,186 408,245 376,322 C 348,390 295,392 256,388 Z"
            fill="url(#ribbonRight)" opacity="0.9" />

      <!-- Right Ribbon Fold & Notch Feature -->
      <!-- The ribbon arches over and drops down with the signature bookmark v-notch -->
      <path d="M 390,132 C 405,124 425,128 432,145 C 438,160 435,180 420,218 L 388,290 C 378,312 360,320 348,308 L 338,240 L 372,210 L 332,216 L 336,195 C 345,160 368,142 390,132 Z"
            fill="url(#ribbonLoop)" />
      
      <!-- Crisp Bookmark V-Notch cutout / overlay detail -->
      <path d="M 338,240 L 372,210 L 356,260 Z"
            fill="#0051d5" fill-opacity="0.35" />

      <!-- Top Page Curl Specular Rim -->
      <path d="M 146,132 C 172,138 200,165 218,205"
            stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />
      
      <!-- Right Ribbon Top Arch Specular Rim -->
      <path d="M 385,134 C 405,124 425,130 430,146"
            stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9" />

      <!-- Central apex subtle glow -->
      <ellipse cx="256" cy="382" rx="24" ry="10" fill="#ffffff" opacity="0.6" />
    </g>
  </g>
</svg>